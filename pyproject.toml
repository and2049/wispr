[project]
name = "wispr-lrc"
version = "0.1.1"
description = "Generate line-level LRC files from audio and canonical lyrics."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "click>=8.1",
  "mutagen>=1.47",
  "typer>=0.12",
]

[project.optional-dependencies]
ml = [
  "whisperx>=3.0",
]
separation = [
  "demucs>=4",
]

[project.scripts]
wispr = "wispr.cli:app"

[dependency-groups]
dev = [
  "pytest>=8",
  "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wispr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "ml: slow tests that require real ML dependencies and model downloads",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
